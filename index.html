<title>Norfolk Catholic School</title>
<style>
html, body { margin:0; width:100%; height:100%; overflow:hidden; font-family:Arial,sans-serif; }
#site-shell { position:fixed; inset:0; display:grid; grid-template-rows:60px minmax(0,1fr); background:#fff; }
#site-header { width:100%; height:60px; border:0; display:block; }
#site-body { min-height:0; display:grid; grid-template-columns:180px minmax(0,1fr); }
#site-menu { width:180px; height:100%; border:0; display:block; }
#site-main { width:100%; height:100%; border:0; display:block; background:#fff; }
#custom-games-dropdown {
  display:none; position:fixed; z-index:1000001; min-width:210px; max-width:280px;
  max-height:65vh; overflow:auto; background:#fff; color:#333; border:1px solid #dadce0;
  border-radius:6px; box-shadow:0 4px 12px rgba(0,0,0,.25); padding:5px 0;
  font:14px Arial,sans-serif;
}
#custom-games-dropdown.open { display:block; }
#custom-games-dropdown button {
  display:block; width:100%; border:0; background:transparent; color:#333;
  text-align:left; padding:9px 16px; font:14px Arial,sans-serif; cursor:pointer;
}
#custom-games-dropdown button:hover { background:#f1f3f4; }
#custom-games-dropdown .games-loading { padding:10px 16px; color:#777; }
#custom-game-overlay { display:none; position:fixed; inset:0; z-index:1000002; background:#111; }
#custom-game-overlay.active { display:block; }
#custom-game-frame { position:absolute; inset:0; width:100%; height:100%; border:0; background:#fff; }
#custom-game-close {
  position:absolute; top:12px; right:16px; z-index:1000003; width:42px; height:42px;
  border:0; border-radius:50%; background:rgba(0,0,0,.75); color:#fff; font-size:25px; cursor:pointer;
}
#custom-game-close:hover { background:#333; }
@media(max-width:600px) {
  #site-shell { grid-template-rows:60px minmax(0,1fr); }
  #site-body { grid-template-columns:145px minmax(0,1fr); }
  #site-menu { width:145px; }
}
</style>

  window.openEmbeddedPage = function (url) {
    frame.src = url;
    overlay.classList.add('active');
    dropdown.classList.remove('open');
    document.documentElement.style.overflow = 'hidden';
    document.body.style.overflow = 'hidden';
  };

  function closeGame() {
    overlay.classList.remove('active');
    frame.src = 'about:blank';
    document.documentElement.style.overflow = '';
    document.body.style.overflow = '';
  }
  closeButton.addEventListener('click', closeGame);

  window.toggleGamesDropdownFrom = function (link, sourceFrame) {
    if (dropdown.classList.contains('open')) {
      dropdown.classList.remove('open');
      return;
    }
    const linkRect = link.getBoundingClientRect();
    const frameRect = sourceFrame.getBoundingClientRect();
    dropdown.style.left = Math.max(4, Math.min(window.innerWidth - 290, frameRect.left + linkRect.left)) + 'px';
    dropdown.style.top = Math.min(window.innerHeight - 80, frameRect.top + linkRect.bottom) + 'px';
    dropdown.classList.add('open');
  };

  document.addEventListener('click', function (event) {
    if (!dropdown.contains(event.target)) dropdown.classList.remove('open');
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') {
      if (overlay.classList.contains('active')) closeGame();
      else dropdown.classList.remove('open');
    }
  });

  async function loadGames() {
    dropdown.innerHTML = '<div class="games-loading">Loading games...</div>';
    try {
      const response = await fetch(GAMES_JSON, {cache:'no-store'});
      if (!response.ok) throw new Error('Could not load games.json');
      const games = await response.json();
      if (!Array.isArray(games)) throw new Error('Invalid games.json format');
      dropdown.innerHTML = '';
      games.forEach(function (game) {
        if (!game || typeof game.name !== 'string' || typeof game.file !== 'string') return;
        const file = game.file.trim();
        if (!file || /^(?:[a-z]+:)?\/\//i.test(file) || file.startsWith('/') || file.split('/').includes('..')) return;
        const gameUrl = new URL(file, GAME_REPO_BASE).href;
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = game.name;
        button.addEventListener('click', function () { window.openEmbeddedPage(gameUrl); });
        dropdown.appendChild(button);
      });
      if (!dropdown.children.length) dropdown.innerHTML = '<div class="games-loading">No games found.</div>';
    } catch (error) {
      console.error('Unable to load games:', error);
      dropdown.innerHTML = '<div class="games-loading">Unable to load games.</div>';
    }
  }
  loadGames();
})();
</script>
</body>
</html>
